services:
  - type: web
    name: cupcakes-shop
    env: docker
    dockerfilePath: ./Dockerfile.render
    plan: free
    envVars:
      - key: APP_NAME
        value: Cupcakes
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        sync: false
      - key: APP_KEY
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        sync: false
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: FILESYSTEM_DISK
        value: local
      - key: PRODUCT_IMAGE_DISK
        value: cloudinary
      - key: CLOUDINARY_URL
        sync: false
      - key: MAIL_MAILER
        value: log
